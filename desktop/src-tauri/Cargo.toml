[package]
name = "nako"
version = "0.2.1"
description = "Nako Portal for the desktop"
edition = "2021"
publish = false

[lib]
name = "nako_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["time", "sync", "net", "io-util", "macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
notify-rust = "4"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
webbrowser = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
