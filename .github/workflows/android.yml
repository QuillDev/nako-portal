name: Android

# PRs only test and lint the shell. APKs are built when a GitHub release tagged
# android-v<version> is published.
on:
  pull_request:
    paths: [android/**, .github/workflows/android.yml]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

  # A published android-v<version> release gets the signed APK that installed
  # apps pick up through the portal. The run number keeps version codes increasing.
  release:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'android-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PORTAL_ANDROID_VERSION_CODE: ${{ github.run_number }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Read version from the tag
        working-directory: .
        run: |
          version="${TAG#android-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG must look like android-v1.2.3" >&2
            exit 1
          fi
          echo "PORTAL_ANDROID_VERSION_NAME=$version" >> "$GITHUB_ENV"
      - name: Install JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Before the key is restored: with PORTAL_ANDROID_KEYSTORE set, Gradle requires the signing passwords.
      - name: Run unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PORTAL_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PORTAL_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          PORTAL_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PORTAL_ANDROID_KEYSTORE_PASSWORD }}
          PORTAL_ANDROID_KEY_PASSWORD: ${{ secrets.PORTAL_ANDROID_KEYSTORE_PASSWORD }}
          PORTAL_ANDROID_KEY_ALIAS: hermes
        run: ./gradlew --no-daemon assembleRelease
      - name: Describe release
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release/nako.apk"
          cd "$RUNNER_TEMP/release"
          jq -n \
            --argjson versionCode "$PORTAL_ANDROID_VERSION_CODE" \
            --arg versionName "$PORTAL_ANDROID_VERSION_NAME" \
            --arg sha256 "$(sha256sum nako.apk | cut -d' ' -f1)" \
            --argjson sizeBytes "$(stat -c %s nako.apk)" \
            '{versionCode: $versionCode, versionName: $versionName, sha256: $sha256, sizeBytes: $sizeBytes}' \
            > android-release.json
          cat android-release.json
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "$RUNNER_TEMP/release/nako.apk" "$RUNNER_TEMP/release/android-release.json" \
            --repo "$GITHUB_REPOSITORY" --clobber
