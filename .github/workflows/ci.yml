name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install
        run: uv pip install --system "aiohttp>=3.12,<4" cryptography pytest pytest-asyncio pytest-xdist ruff
      - name: Lint Python
        run: ruff check __init__.py plugin_*.py groups_tools.py mesh_tools.py provider_accounts.py dashboard tests
      - name: Test
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install
        run: bun install --frozen-lockfile
        working-directory: web
      - name: Check
        run: bun run check
        working-directory: web
      - name: Build
        run: bun run build
        working-directory: web
      # The portal serves dashboard/web as committed, so it has to match the source.
      - name: Built app is committed
        run: git status --porcelain dashboard/web && test -z "$(git status --porcelain dashboard/web)"

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      # Only the shell's own tests: no Electron binary, no app build.
      - name: Install
        run: npm ci --ignore-scripts
        working-directory: desktop
      - name: Test
        run: npm test
        working-directory: desktop
