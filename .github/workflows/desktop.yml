name: Desktop

# PRs test, lint and build the desktop app on Linux, Windows and macOS. Publishing a GitHub
# release tagged desktop-v<version> builds the signed Linux and Windows apps (with the updater
# signatures the app checks) and attaches them with desktop-release.json. macOS installs from
# the Homebrew tap, which builds the tagged source.
on:
  pull_request:
    paths: [desktop/**, .github/workflows/desktop.yml]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: desktop

jobs:
  build:
    if: github.event_name == 'pull_request' || startsWith(github.event.release.tag_name, 'desktop-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the AppImage's glibc floor stays low.
          - os: ubuntu-24.04
            platform: linux-x86_64
            bundles: appimage,deb
          - os: windows-latest
            platform: windows-x86_64
            bundles: nsis
          - os: macos-latest
            platform: darwin-aarch64
            bundles: app
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name }}
      RELEASE: ${{ github.event_name == 'release' && matrix.platform != 'darwin-aarch64' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Read version from the tag
        if: github.event_name == 'release'
        run: |
          version="${TAG#desktop-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG must look like desktop-v1.2.3" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install the Tauri CLI
        run: npm ci
      - name: Run tests and lint
        working-directory: desktop/src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build the app
        if: env.RELEASE != 'true'
        run: npx tauri build --ci --bundles ${{ matrix.bundles }}
      - name: Build the signed release
        if: env.RELEASE == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATER_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DESKTOP_UPDATER_KEY_PASSWORD }}
        run: |
          npx tauri build --ci --bundles ${{ matrix.bundles }} \
            --config "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
      - name: Collect the build
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          bundle=src-tauri/target/release/bundle
          case "${{ matrix.platform }}" in
            linux-*)
              cp $bundle/appimage/*.AppImage "$out/nako.AppImage"
              cp $bundle/deb/*.deb "$out/nako.deb"
              if [ "$RELEASE" = true ]; then cp $bundle/appimage/*.AppImage.sig "$out/nako.AppImage.sig"; fi
              ;;
            windows-*)
              cp $bundle/nsis/*-setup.exe "$out/nako-setup.exe"
              if [ "$RELEASE" = true ]; then cp $bundle/nsis/*-setup.exe.sig "$out/nako-setup.exe.sig"; fi
              ;;
            darwin-*)
              tar -czf "$out/Nako.app.tar.gz" -C $bundle/macos Nako.app
              ;;
          esac
          ls -la "$out"
      - name: Keep the build
        uses: actions/upload-artifact@v5
        with:
          name: nako-desktop-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/*
          retention-days: 7

  # One manifest for every platform the release built; the portal serves it to the apps.
  publish:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Fetch the builds
        uses: actions/download-artifact@v5
        with:
          pattern: nako-desktop-*-x86_64
          merge-multiple: true
          path: release
      - name: Describe release
        working-directory: release
        run: |
          entry() {
            jq -n --arg file "$1" --arg signature "$(cat "$1.sig")" --argjson sizeBytes "$(stat -c %s "$1")" \
              '{file: $file, signature: $signature, sizeBytes: $sizeBytes}'
          }
          jq -n \
            --arg version "${TAG#desktop-v}" \
            --argjson linux "$(entry nako.AppImage)" \
            --argjson windows "$(entry nako-setup.exe)" \
            '{version: $version, platforms: {"linux-x86_64": $linux, "windows-x86_64": $windows}}' \
            > desktop-release.json
          cat desktop-release.json
      - name: Attach the apps to the release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" nako.AppImage nako.AppImage.sig nako.deb nako-setup.exe nako-setup.exe.sig desktop-release.json \
            --repo "$GITHUB_REPOSITORY" --clobber
