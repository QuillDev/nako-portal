name: Desktop

# PRs test, lint and build the desktop app. Signed release builds (with the updater
# signature the app checks) happen when a GitHub release tagged desktop-v<version> is published.
on:
  pull_request:
    paths: [desktop/**, .github/workflows/desktop.yml]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  build:
    if: github.event_name == 'pull_request' || startsWith(github.event.release.tag_name, 'desktop-v')
    # The oldest supported runner, so the AppImage's glibc floor stays low.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Read version from the tag
        if: github.event_name == 'release'
        run: |
          version="${TAG#desktop-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $TAG must look like desktop-v1.2.3" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install the Tauri CLI
        run: npm ci
      - name: Run tests and lint
        working-directory: desktop/src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build the app
        if: github.event_name == 'pull_request'
        run: npx tauri build --ci --bundles appimage,deb
      - name: Keep the PR build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: nako-desktop-linux
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7
      - name: Build the signed release
        if: github.event_name == 'release'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATER_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DESKTOP_UPDATER_KEY_PASSWORD }}
        run: |
          npx tauri build --ci --bundles appimage,deb \
            --config "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
      - name: Describe release
        if: github.event_name == 'release'
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "$out/nako.AppImage"
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig "$out/nako.AppImage.sig"
          cp src-tauri/target/release/bundle/deb/*.deb "$out/nako.deb"
          cd "$out"
          jq -n \
            --arg version "$VERSION" \
            --arg signature "$(cat nako.AppImage.sig)" \
            --arg sha256 "$(sha256sum nako.AppImage | cut -d' ' -f1)" \
            --argjson sizeBytes "$(stat -c %s nako.AppImage)" \
            '{version: $version, signature: $signature, sha256: $sha256, sizeBytes: $sizeBytes}' \
            > desktop-release.json
          cat desktop-release.json
      - name: Attach the app to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release"
          gh release upload "$TAG" nako.AppImage nako.AppImage.sig nako.deb desktop-release.json \
            --repo "$GITHUB_REPOSITORY" --clobber
